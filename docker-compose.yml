services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ANALYTICS_POSTGRES_PORT:-5434}:5432"
    environment:
      POSTGRES_DB: analytics
      POSTGRES_USER: teammemory
      POSTGRES_PASSWORD: teammemory
    volumes:
      - analytics-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teammemory -d analytics"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.4-management
    hostname: teammemory-rabbitmq
    restart: unless-stopped
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: teammemory
      RABBITMQ_DEFAULT_PASS: teammemory
      RABBITMQ_DEFAULT_VHOST: "/"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  database-init:
    image: postgres:17
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: teammemory
      PGPASSWORD: teammemory
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        for database in analytics group_dashboard; do
          if ! psql -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='$$database'" | grep -qx 1; then
            createdb --owner="$$PGUSER" "$$database"
          fi
        done

  analytics:
    build:
      context: .
      target: analytics
    restart: unless-stopped
    depends_on:
      database-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    environment:
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__Analytics: Host=postgres;Port=5432;Database=analytics;Username=teammemory;Password=teammemory
      RabbitMq__Host: rabbitmq
      LlmApi__Endpoint: ${LlmApi__Endpoint:-https://api.deepseek.com/chat/completions}
      LlmApi__Model: ${LlmApi__Model:-deepseek-flash}
      LlmApi__ApiKey: ${LlmApi__ApiKey:-}
      LlmApi__MaxTokens: ${LlmApi__MaxTokens:-1500}
      LlmApi__TimeoutSeconds: ${LlmApi__TimeoutSeconds:-300}
      LlmApi__UseJsonMode: ${LlmApi__UseJsonMode:-true}

  dashboard:
    build:
      context: .
      target: dashboard
    restart: unless-stopped
    depends_on:
      database-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    ports:
      - "127.0.0.1:5080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=group_dashboard;Username=teammemory;Password=teammemory
      RabbitMq__Host: rabbitmq
      Telegram__BotToken: ${TELEGRAM_BOT_TOKEN:?Set TELEGRAM_BOT_TOKEN in .env}
      MiniApp__DevelopmentManagerId: ${MINIAPP_DEVELOPMENT_MANAGER_ID:-123456789}
      Demo__SeedGroupChatId: ${DEMO_GROUP_CHAT_ID:--1001234567890}
      Demo__SeedGroupTitle: ${DEMO_GROUP_TITLE:-Demo Team}
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  ingestion:
    build:
      context: .
      target: ingestion
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
    ports:
      - "127.0.0.1:5081:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      RabbitMq__Host: rabbitmq
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Set TELEGRAM_BOT_TOKEN in .env}
      WEBHOOK_BASE_URL: ${WEBHOOK_BASE_URL:-}
      TelegramWebhook__SecretToken: ${TELEGRAM_WEBHOOK_SECRET:-}
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      dashboard:
        condition: service_healthy
        restart: true
    ports:
      - "127.0.0.1:5173:80"

volumes:
  analytics-data:
  rabbitmq-data:
