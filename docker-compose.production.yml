name: teammemory-production

x-common: &common
  restart: unless-stopped
  stop_grace_period: 60s
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

x-rabbit-env: &rabbit-env
  RabbitMq__Host: rabbitmq
  RabbitMq__VirtualHost: ${RABBITMQ_VHOST:-/}
  RabbitMq__Username: ${RABBITMQ_USER:?Set RABBITMQ_USER}
  RabbitMq__Password: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}

x-web-health: &web-health
  test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://127.0.0.1:8080/health/ready"]
  interval: 10s
  timeout: 5s
  retries: 6
  start_period: 30s

services:
  postgres:
    <<: *common
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - analytics-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  rabbitmq:
    <<: *common
    image: rabbitmq:4.4-management
    hostname: teammemory-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Set RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  analytics:
    <<: *common
    image: teammemory/analytics:${APP_IMAGE_TAG:?Set APP_IMAGE_TAG}
    build:
      context: .
      dockerfile: src/AnalyticsService/Dockerfile
    init: true
    environment:
      <<: *rabbit-env
      DOTNET_ENVIRONMENT: Production
      ConnectionStrings__Analytics: 'Host=postgres;Port=5432;Database=${POSTGRES_DB:?Set POSTGRES_DB};Username=${POSTGRES_USER:?Set POSTGRES_USER};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}'
      LlmApi__Endpoint: ${LlmApi__Endpoint:?Set LlmApi__Endpoint}
      LlmApi__Model: ${LlmApi__Model:?Set LlmApi__Model}
      LlmApi__ApiKey: ${LlmApi__ApiKey:?Set LlmApi__ApiKey}
      LlmApi__MaxTokens: ${LlmApi__MaxTokens:-1500}
      LlmApi__TimeoutSeconds: ${LlmApi__TimeoutSeconds:-300}
      LlmApi__UseJsonMode: ${LlmApi__UseJsonMode:-true}
      Analytics__IdleSeconds: ${Analytics__IdleSeconds:-60}
      Analytics__MaxWaitSeconds: ${Analytics__MaxWaitSeconds:-300}
      Analytics__MaxMessages: ${Analytics__MaxMessages:-100}
      Analytics__PollSeconds: ${Analytics__PollSeconds:-5}
      Analytics__MaxAttempts: ${Analytics__MaxAttempts:-5}
      Analytics__MinimumConfidence: ${Analytics__MinimumConfidence:-0.70}
      Analytics__RiskMultiplier: ${Analytics__RiskMultiplier:-1.5}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  dashboard:
    <<: *common
    image: teammemory/dashboard:${APP_IMAGE_TAG:?Set APP_IMAGE_TAG}
    build:
      context: .
      dockerfile: src/DashboardService/Dockerfile
    init: true
    environment:
      <<: *rabbit-env
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
    healthcheck: *web-health
    depends_on:
      rabbitmq:
        condition: service_healthy

  ingestion:
    <<: *common
    image: teammemory/ingestion:${APP_IMAGE_TAG:?Set APP_IMAGE_TAG}
    build:
      context: .
      dockerfile: src/IngestionService/Dockerfile
    init: true
    environment:
      <<: *rabbit-env
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Set TELEGRAM_BOT_TOKEN}
      TelegramWebhook__SecretToken: ${TELEGRAM_WEBHOOK_SECRET:?Set TELEGRAM_WEBHOOK_SECRET}
      WEBHOOK_BASE_URL: https://${APP_DOMAIN:?Set APP_DOMAIN}
    healthcheck: *web-health
    depends_on:
      rabbitmq:
        condition: service_healthy

  proxy:
    <<: *common
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      ingestion:
        condition: service_healthy

volumes:
  analytics-data:
  rabbitmq-data:
  caddy-data:
  caddy-config:
