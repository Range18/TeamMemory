services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: analytics_checks
      POSTGRES_USER: teammemory
      POSTGRES_PASSWORD: teammemory
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teammemory -d analytics_checks"]
      interval: 2s
      timeout: 3s
      retries: 30
  rabbitmq:
    image: rabbitmq:4.4-management
    environment:
      RABBITMQ_DEFAULT_USER: teammemory
      RABBITMQ_DEFAULT_PASS: teammemory
    ports:
      - "127.0.0.1:5673:5672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 3s
      timeout: 5s
      retries: 30
